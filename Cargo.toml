[package]
name = "forgec"
version = "0.1.0"
edition = "2024"
description = "Self-contained compiler for the Forge systems programming language — parses .dev sources and emits native executables directly, with no external toolchain"
license = "MIT"
repository = "https://github.com/celestiamia/Forge"
readme = "README.md"
keywords = ["compiler", "language", "systems", "codegen", "x86"]
categories = ["compilers", "development-tools"]

[dependencies]
anyhow = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
tempfile = "3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
assert_cmd = "2"
predicates = "3"
