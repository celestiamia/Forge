name: Bug Report
description: Report a compiler crash, incorrect codegen, type error, or other bug
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of the bug
      placeholder: What happened? What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Minimal Reproduction
      description: Provide a minimal `.dev` file that reproduces the issue
      placeholder: |
        package test

        pub def main() -> int32:
            # code that triggers the bug
            return 0
      render: dev
    validations:
      required: true

  - type: textarea
    id: command
    attributes:
      label: Command Used
      description: The exact forgec command you ran
      placeholder: ./target/release/forgec test.dev -o test --target x86_64-unknown-linux-gnu
    validations:
      required: true

  - type: dropdown
    id: target
    attributes:
      label: Target
      description: Which target were you compiling for?
      options:
        - x86_64-unknown-linux-gnu (default)
        - x86_32-unknown-linux-gnu
        - x86_16-boot
        - Other (specify in description)
    validations:
      required: true

  - type: textarea
    id: error
    attributes:
      label: Error Output
      description: Paste the full error message, compiler output, or crash dump
      placeholder: |
        error: type mismatch
           --> test.dev:5:10
            |
        5 |     let x: int32 = "hello"
            |          ^^^^^ expected int32, found string
      render: text
    validations:
      required: false

  - type: input
    id: rust_version
    attributes:
      label: Rust Version
      description: Output of `rustc --version`
      placeholder: rustc 1.80.0 (051478957 2024-07-21)
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: Operating System
      description: OS and version (e.g., Ubuntu 24.04, Arch Linux, macOS 14)
      placeholder: Ubuntu 24.04 LTS
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues for duplicates
          required: true
        - label: I have provided a minimal reproduction case
          required: true
        - label: I am using the latest `main` branch
          required: false